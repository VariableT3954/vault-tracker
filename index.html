<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vault">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
  <title>Vault Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="banner"></div>
  <main id="app" aria-live="polite"></main>
  <nav id="tabs" aria-label="Sections"></nav>
  <div id="toast" role="status"></div>
  <script>
    // If the app's code fails to load, say so instead of showing a blank screen.
    window.addEventListener('error', function () {
      var app = document.getElementById('app');
      if (app && !app.childElementCount) {
        app.innerHTML = '<h1>Vault Tracker</h1><p>The app didn\'t load properly. Close it fully and open it again. ' +
          'Your saved workouts are still on this phone.</p>';
      }
    }, true);
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
